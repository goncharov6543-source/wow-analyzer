
    <!DOCTYPE html>
    <html>
    <head>
        <meta charset="utf-8">
        <title>WoW Analyzer</title>
        <link rel="icon" type="image/png" href="gold.jpg">
        <script src="https://wow.zamimg.com/js/tooltips.js"></script>
        <style>
            :root { --bg: #121212; --panel: #1e1e1e; --border: #333; --gold: #ffd700; --blue: #0070dd; --green: #00ff99; --red: #ff4444; }
            html { scrollbar-gutter: stable; } 

            body { background-color: var(--bg); color: #e0e0e0; font-family: 'Segoe UI', sans-serif; padding: 25px; margin: 0; font-size: 16px; }
            
            /* DARK THIN SCROLLBARS */
            ::-webkit-scrollbar { width: 6px; }
            ::-webkit-scrollbar-track { background: #1a1a1a; }
            ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
            ::-webkit-scrollbar-thumb:hover { background: #444; }

            a { color: #fff; text-decoration: none; }

            .fade-in { animation: fadeIn 0.4s ease-in-out; }
            @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

            .top-bar { display: flex; align-items: center; margin-bottom: 25px; gap: 20px; flex-wrap: wrap; justify-content: space-between; }
            
            .char-chip { 
                position: relative; display: flex; align-items: center; background: var(--panel); 
                padding: 6px 1px 6px 6px; border-radius: 50px; border: 2px solid var(--border); 
                box-shadow: 0 4px 10px rgba(0,0,0,0.4); cursor: pointer; transition: 0.2s; user-select: none; 
                margin-right: 15px; margin-top: 5px; margin-bottom: 5px;
                min-width: 220px; /* Ensure space for icons */
                justify-content: space-between; 
            }
            .char-chip:hover { border-color: #666; }
            .char-chip.active { border-color: var(--blue); background: #252525; }
            
            .char-chip-main { display: flex; align-items: center; flex-grow: 1; margin-right: 15px; }
            .char-chip img.cls-icon { width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--gold); margin-right: 10px; object-fit: cover; }
            
            .chip-info { display: flex; flex-direction: column; }
            .chip-name { font-weight: bold; color: #fff; font-size: 15px; line-height: 1.2; }
            .chip-realm { font-size: 11px; color: #999; text-transform: uppercase; letter-spacing: 0.5px; }

            .char-prof-wrapper { display: flex; gap: 5px; margin-right: 10px; }
            .prof-icon-round { width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--gold); object-fit: cover; background: #000; }

            .circle-btn {
                position: absolute; width: 22px; height: 22px; border-radius: 50%; 
                display: flex; align-items: center; justify-content: center;
                font-size: 13px; font-weight: bold; cursor: pointer; line-height: 1;
                opacity: 0; transition: 0.2s; border: 2px solid var(--bg); z-index: 20;
                box-shadow: 0 2px 5px rgba(0,0,0,0.5); flex-shrink: 0;
            }
            .char-chip:hover .circle-btn { opacity: 1; }
            .delete-char { right: -6px; top: -6px; background: var(--red); color: white; padding-bottom: 2px; }
            .edit-char { left: -6px; top: -6px; background: var(--blue); color: white; font-size: 12px; }
            
            .add-btn-small { width: 40px; height: 40px; background: var(--blue); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 24px; cursor: pointer; transition: 0.2s; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

            .nav-bar { display: flex; gap: 15px; margin-left: auto; }
            .nav-btn {
                background: transparent; border: 2px solid #444; color: #888;
                padding: 10px 25px; font-weight: bold; font-size: 14px; cursor: pointer;
                transition: 0.2s; text-transform: uppercase; border-radius: 4px; letter-spacing: 1px;
            }
            .nav-btn:hover { border-color: #777; color: #fff; }
            .nav-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; box-shadow: 0 0 15px rgba(0, 112, 221, 0.3); }

            #view-reagents { display: block; }
            #view-dashboard, #view-profOverview { display: none; margin-top: 20px; }
            
            #dashboard-controls { 
                display: flex; 
                align-items: center; 
                min-height: 56px; 
                opacity: 0; 
                visibility: hidden;
                transition: opacity 0.3s ease, visibility 0.3s ease; 
            }
            #dashboard-controls.visible {
                opacity: 1;
                visibility: visible;
            }

            .prof-section { margin-bottom: 30px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: #151515; }
            .reagent-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; padding: 20px; }
            .chart-bg { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.25; pointer-events: none; }
            .reagent-card { position: relative; z-index: 1; }
            .r-info, .r-icon-wrapper { position: relative; z-index: 2; } 

            #big-add-container { display: flex; justify-content: center; align-items: center; height: 70vh; flex-direction: column; gap: 20px; }
            .big-plus-btn { width: 140px; height: 140px; border-radius: 50%; background: var(--panel); border: 2px dashed #555; color: #555; font-size: 70px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
            .big-plus-btn:hover { border-color: var(--blue); color: var(--blue); transform: scale(1.1); box-shadow: 0 0 30px rgba(0, 112, 221, 0.2); }

            .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
            .modal-box { background: var(--panel); padding: 40px; border-radius: 12px; width: 800px; border: 1px solid var(--border); box-shadow: 0 10px 40px rgba(0,0,0,0.7); position: relative; }
            .modal-title { font-size: 24px; font-weight: bold; margin-bottom: 25px; color: #fff; text-align: center; }
            .input-group { margin-bottom: 20px; }
            .input-label { font-size: 14px; color: #aaa; text-transform: uppercase; margin-bottom: 8px; display: block; }
            textarea { width: 100%; height: 100px; background: #111; border: 1px solid #333; color: var(--green); padding: 12px; font-family: monospace; border-radius: 6px; resize: none; box-sizing: border-box; font-size: 14px; }
            .import-btn { width: 100%; padding: 15px; background: var(--blue); color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 18px; cursor: pointer; margin-top: 15px; }
            .close-modal { position: absolute; top: 20px; right: 25px; color: #888; font-size: 28px; font-weight: bold; cursor: pointer; transition: 0.2s; line-height: 1; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 4px; }
            .close-modal:hover { color: #fff; background: rgba(255,255,255,0.1); }

            .dashboard-grid { display: none; grid-template-columns: 1fr 1fr; gap: 25px; align-items: start; }
            .prof-column { background: var(--panel); border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
            .prof-header { background: #252525; padding: 18px; font-weight: bold; text-transform: uppercase; color: var(--gold); text-align: center; border-bottom: 1px solid var(--border); font-size: 16px; letter-spacing: 1px; }

            table { width: 100%; border-collapse: collapse; }
            
            th, td { border-bottom: 1px solid #333; }
            
            th:first-child, td:first-child { 
                text-align: left; 
                padding: 12px 15px; 
                width: auto; 
            }
            
            th:not(:first-child), td:not(:first-child) {
                width: 1%;
                white-space: nowrap;
                padding: 12px 25px 12px 15px;
                text-align: right;
            }

            th { background: #222; color: #aaa; font-size: 13px; text-transform: uppercase; cursor: default; user-select: none; }
            th.sortable:hover { color: #fff; background: #2a2a2a; cursor: pointer; }
            th:not(.sortable):hover { background: #222; }

            td { vertical-align: middle; font-size: 16px; }
            tr.main-row { cursor: pointer; transition: 0.1s; }
            tr.main-row:hover { background: #2a2a2a; }
            .item-cell { display: flex; align-items: center; gap: 12px; }
            .item-icon { width: 40px; height: 40px; border-radius: 4px; border: 1px solid #444; }
            .coin-icon { width: 18px; height: 18px; vertical-align: -3px; margin-left: 5px; border-radius: 50%; }
            .gold-txt { color: var(--gold); font-weight: 500; font-size: 15px; }
            .profit-pos { color: var(--green); font-weight: bold; }
            .profit-neg { color: #ff4444; }
            .conc-col { color: #00ccff; font-weight: bold; font-size: 14px; }

            .char-header-block { display: flex; align-items: center; margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px solid #333; }
            .char-header-block img { width: 64px; height: 64px; border-radius: 50%; margin-right: 20px; border: 3px solid var(--gold); }
            .char-header-info { display: flex; flex-direction: column; }
            .char-header-name { font-size: 24px; font-weight: bold; color: #fff; }
            .char-header-server { font-size: 14px; color: #999; text-transform: uppercase; }
            .trait-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
            
            .trait-column { background: #151515; padding: 20px; border-radius: 8px; border: 1px solid #333; height: auto; }
            
            .trait-header { font-weight: bold; color: var(--gold); margin-bottom: 15px; text-align: center; text-transform: uppercase; font-size: 18px; }
            .skill-container { margin-bottom: 20px; }
            .skill-labels { display: flex; justify-content: space-between; font-size: 14px; color: #ccc; margin-bottom: 6px; }
            .skill-bar-bg { height: 10px; background: #222; border-radius: 5px; overflow: hidden; border: 1px solid #444; }
            .skill-bar-fill { height: 100%; background: var(--blue); width: 0%; transition: width 0.5s; }
            .trait-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed #333; font-size: 15px; }
            .trait-left { display: flex; align-items: center; gap: 10px; }
            .trait-icon { width: 28px; height: 28px; border-radius: 4px; border: 1px solid #444; }
            .trait-rank { color: var(--green); font-weight: bold; font-family: monospace; font-size: 16px; }

            tr.details-row { visibility: collapse; }
            tr.details-row.open { visibility: visible; }
            .details-container { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; background: #151515; border-bottom: 1px solid #333; }
            .details-container.active { max-height: 700px; }
            .details-wrapper { padding: 20px; display: flex; gap: 25px; border-left: 5px solid var(--blue); }
            .stats-col, .reagents-col { flex: 1; }
            .stat-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 14px; border-bottom: 1px dashed #333; padding-bottom: 3px; }
            .reagent-item { display: flex; justify-content: space-between; padding: 6px; background: #222; margin-bottom: 6px; border-radius: 4px; font-size: 14px; }
            .reagent-left { display: flex; align-items: center; gap: 10px; }

            /* --- DASHBOARD HEADER --- */
            .dash-search-container { display: flex; align-items: center; gap: 8px; width: 100%; }
            .dash-search-input { 
                width: 140px; background: #121212; border: 1px solid #444; border-radius: 4px; 
                padding: 6px 10px; color: #fff; font-size: 13px; outline: none; transition: 0.2s; 
            }
            .dash-search-input:focus { border-color: var(--gold); }
            .setup-btn { 
                background: #333; border: 1px solid #555; color: #ccc; border-radius: 4px; 
                padding: 5px 12px; cursor: pointer; font-size: 12px; font-weight: bold; text-transform: uppercase;
                transition: 0.2s; white-space: nowrap;
            }
            .setup-btn:hover { background: #444; color: #fff; border-color: #777; }

            /* --- SETUP MODAL --- */
            .setup-header-row { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 25px; }
            .setup-label { color: #aaa; font-size: 16px; text-transform: uppercase; font-weight: bold; }
            .setup-input { 
                width: 80px; height: 35px; background: #111; border: 1px solid #444; color: var(--gold); 
                padding: 0 10px; text-align: center; font-size: 18px; font-weight: bold; border-radius: 6px; 
                box-sizing: border-box; -moz-appearance: textfield;
            }
            .setup-input::-webkit-outer-spin-button,
            .setup-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
            
            .setup-gen-btn { 
                height: 35px; background: var(--blue); color: white; border: none; padding: 0 20px; 
                border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; box-sizing: border-box; display: flex; align-items: center;
            }
            .setup-gen-btn:hover { filter: brightness(1.2); }
            
            .setup-results { 
                margin-top: 20px; border-top: 1px solid #333; 
                padding: 20px 25px;
                max-height: 400px; overflow-y: auto; overflow-x: hidden; 
            }
            
            .setup-row { 
                position: relative; display: flex; align-items: center; justify-content: space-between; 
                background: #222; padding: 10px 15px; margin-bottom: 12px; border-radius: 6px; border: 1px solid #333; 
                transition: background 0.2s;
            }
            .setup-row:hover { background: #2a2a2a; }
            .setup-item-info { display: flex; align-items: center; gap: 12px; }
            .setup-count-badge { 
                background: var(--gold); color: #000; font-weight: bold; padding: 4px 10px; 
                border-radius: 4px; font-size: 14px; min-width: 30px; text-align: center; 
            }
            
            .action-badge { 
                position: absolute; width: 22px; height: 22px; border-radius: 50%; 
                display: flex; align-items: center; justify-content: center; cursor: pointer; 
                color: white; font-weight: bold; font-size: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.5);
                opacity: 0; transition: opacity 0.2s, transform 0.2s; z-index: 100;
            }
            .setup-row:hover .action-badge { opacity: 1; }
            .action-badge:hover { transform: scale(1.1); }
            
            .action-badge.edit { top: -8px; left: -8px; background: var(--blue); border: 2px solid var(--bg); }
            .action-badge.del { top: -8px; right: -8px; background: var(--red); border: 2px solid var(--bg); }

            .add-recipe-row {
                border: 2px dashed #444; border-radius: 6px; padding: 12px; text-align: center; 
                color: #777; cursor: pointer; transition: 0.2s; font-weight: bold; margin-top: 15px;
                text-transform: uppercase; font-size: 13px; letter-spacing: 1px;
            }
            .add-recipe-row:hover { border-color: var(--blue); color: var(--blue); background: rgba(0, 112, 221, 0.05); }

            .recipe-dropdown {
                position: fixed; /* Fixed position */
                background: #252525; border: 1px solid #444; border-radius: 6px;
                width: 300px; max-height: 250px; overflow-y: auto; z-index: 2000;
                box-shadow: 0 10px 30px rgba(0,0,0,0.8); display: none;
            }
            
            .rd-search-container { position: sticky; top: 0; background: #252525; padding: 8px; border-bottom: 1px solid #444; z-index: 10; }
            .rd-search-input { 
                width: 100%; box-sizing: border-box; background: #151515; border: 1px solid #444; 
                padding: 6px 8px; color: #fff; font-size: 12px; border-radius: 4px; outline: none;
            }
            .rd-search-input:focus { border-color: var(--blue); }

            .rd-item { 
                padding: 8px 12px; display: flex; align-items: center; gap: 10px; 
                cursor: pointer; border-bottom: 1px solid #333; 
            }
            .rd-item:hover { background: var(--blue); color: white; }
            .rd-item:last-child { border-bottom: none; }
            .rd-img { width: 28px; height: 28px; border-radius: 4px; border: 1px solid #000; }
            .rd-name { font-size: 13px; font-weight: bold; }

            .setup-footer { 
                margin-top: 20px; border-top: 1px solid #333; padding-top: 20px; 
                display: flex; justify-content: center; 
            }
            .setup-import-btn {
                background: var(--green); color: #000; border: none; padding: 12px 30px;
                border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px;
                transition: background-color 0.3s ease, transform 0.1s; 
            }
            .setup-import-btn:hover { filter: brightness(1.2); }
        </style>
        
        <script>
            const ProfOverviewConcentration = {
    // Внутрішній стан
    isInit: false,
    sortConfig: { col: 'profit', dir: 'desc' }, 
    
    // === 1. ЗАПУСК ===
    init: function() {
        console.log("🚀 Concentration Tab: Initializing...");
        
        const container = document.getElementById('conc-body-target');
        if (!container) return;

        if (typeof PRICES === 'undefined' || Object.keys(PRICES).length === 0) {
            console.warn("⚠️ PRICES object is empty.");
        }

        this.injectLocalStyles();
        this.renderRows();
    },

    // === 2. СОРТУВАННЯ ===
    applySort: function(colName) {
        if (this.sortConfig.col === colName) {
            this.sortConfig.dir = (this.sortConfig.dir === 'desc') ? 'asc' : 'desc';
        } else {
            this.sortConfig.col = colName;
            this.sortConfig.dir = 'desc';
        }
        this.renderRows();
    },

    getQualityIcon: function(tier) {
        if(!tier) return '';
        return `<img src="tier${tier}.png" class="q-icon">`;
    },

    // === 3. РЕНДЕРИНГ ===
    renderRows: function() {
        const container = document.getElementById('conc-body-target');
        
        if (!CONCENTRATION_DB || !CONCENTRATION_DB.length) {
            container.innerHTML = '<tr><td colspan="4" style="text-align:center;">Database empty.</td></tr>';
            return;
        }

        // Константи з index.js
        const RES_FACTOR = 0.5;
        const MULTI_BONUS = 2;

        // 1. Розрахунки (Базові + Бонуси по логіці index.js)
        let calculatedRows = CONCENTRATION_DB.map((item, index) => {
            const ahPrice = this.getPrice(item.name);
            const iconUrl = this.getIcon(item.name);
            const badgeColor = (typeof PROF_COLORS !== 'undefined' && PROF_COLORS[item.prof]) ? PROF_COLORS[item.prof] : '#444';

            let craftCost = 0;
            const reagentsList = [];

            if (item.recipe) {
                item.recipe.forEach(r => {
                    const rPrice = this.getPrice(r.name); 
                    const rIcon = this.getIcon(r.name);
                    const totalR = rPrice * r.count;
                    craftCost += totalR;
                    reagentsList.push({ name: r.name, qty: r.count, price: rPrice, total: totalR, icon: rIcon });
                });
            }

            const fee = ahPrice * 0.05;
            const baseProfit = ahPrice - fee - craftCost;
            
            const profName = item.prof ? item.prof.toUpperCase() : "";
            const isEnchanting = profName.includes("ENCHANTING");
            const ingFactor = isEnchanting ? 1.0 : 0.5;

            const penalty = item.statPenalty || 0;
            const penaltyMult = Math.max(0, (100 - penalty) / 100);

            // --- РОЗРАХУНОК БОНУСІВ ---
            let totalBonus = 0;
            let bonusBreakdown = {}; 

            if (item.stats && item.stats.length > 0) {
                item.stats.forEach(stat => {
                    let val = stat.count; 
                    let bonusGold = 0;
                    const sName = stat.name.toLowerCase();

                    if (sName.includes('resourcefulness')) {
                        let currentResSaving = 0;
                        reagentsList.forEach(reg => {
                            currentResSaving += reg.total * (val / 100) * RES_FACTOR;
                        });
                        bonusGold = currentResSaving;
                    } 
                    else if (sName.includes('ingenuity')) {
                         bonusGold = (ahPrice * (val / 100) * ingFactor) * 0.8;
                    }
                    else if (sName.includes('multicraft')) {
                         bonusGold = (ahPrice * (val / 100) * MULTI_BONUS) * 0.8;
                    }

                    if (bonusGold > 0) {
                        bonusGold *= penaltyMult; 
                        totalBonus += bonusGold;
                        bonusBreakdown[stat.name] = bonusGold; 
                    }
                });
            }

            const totalProfit = baseProfit + totalBonus;
            const profitPerConc = item.ConcCost > 0 ? (totalProfit / item.ConcCost) : 0;
            const isNoData = ahPrice === 0;

            return {
                originalIndex: index,
                item, ahPrice, iconUrl, badgeColor, reagentsList, craftCost, 
                baseProfit, profit: totalProfit, bonusBreakdown, profitPerConc, isNoData
            };
        });

        // 2. Сортування
        calculatedRows.sort((a, b) => {
            let valA = (this.sortConfig.col === 'pc') ? a.profitPerConc : a.profit;
            let valB = (this.sortConfig.col === 'pc') ? b.profitPerConc : b.profit;
            
            if (a.isNoData) return 1;
            if (b.isNoData) return -1;

            return (this.sortConfig.dir === 'desc') ? (valB - valA) : (valA - valB);
        });

        // 3. HTML Генерація
        let html = '';
        calculatedRows.forEach(row => {
            const { item, ahPrice, iconUrl, badgeColor, profit, profitPerConc, isNoData, originalIndex } = row;
            
            const profitClass = isNoData ? 'val-gray' : (profit >= 0 ? 'val-profit' : 'val-neg');
            const displayProfit = isNoData ? 'N/A' : this.fmt(profit);
            const displayPrice = isNoData ? 'N/A' : this.fmt(ahPrice);
            const displayConcGold = isNoData ? 'N/A' : this.fmtDec(profitPerConc);

            const rowId = `conc-row-${originalIndex}`;
            
            let displayNameMain = item.name;
            let tierHtmlMain = '';
            const matchMain = displayNameMain.match(/ [tq]([1-3])/i);
            if (matchMain) {
                tierHtmlMain = this.getQualityIcon(matchMain[1]);
                displayNameMain = displayNameMain.replace(matchMain[0], '').trim();
            }

            html += `
                <tr class="conc-main-row" onclick="ProfOverviewConcentration.toggleDetails('${rowId}')">
                    <td>
                        <div class="conc-flex" style="justify-content: space-between;">
                            <div style="display:flex; align-items:center; gap:15px;">
                                <img src="${iconUrl}" class="conc-icon">
                                <div class="conc-name">${displayNameMain}${tierHtmlMain}</div>
                            </div>
                            <span class="prof-badge" style="background: ${badgeColor};">${item.prof}</span>
                        </div>
                    </td>
                    <td class="text-right val-gold">${displayPrice}</td>
                    <td class="text-right ${profitClass}">${displayProfit}</td>
                    <td class="text-right" style="color:#00ccff; font-weight:bold;">${displayConcGold}</td>
                </tr>
                <tr id="details-${rowId}" class="conc-details-row">
                    <td colspan="4" style="padding:0;">
                        <div id="wrapper-${rowId}" class="expand-wrapper">
                            ${this.generateDetailsHtml(row)}
                        </div>
                    </td>
                </tr>
            `;
        });

        container.innerHTML = html;
    },

    generateDetailsHtml: function(data) {
        let statsHtml = '';
        let avgProfitHtml = '';
        
        if (data.item.stats && data.item.stats.length > 0) {
            data.item.stats.forEach(stat => {
                let val = stat.count;
                let unit = stat.unit || '';
                let bonusGold = (data.bonusBreakdown && data.bonusBreakdown[stat.name]) ? data.bonusBreakdown[stat.name] : 0;

                statsHtml += `
                    <div class="stat-row">
                        <span style="color:#aaa">${stat.name}:</span>
                        <span style="font-weight:bold; color:#fff;">${val}${unit}</span>
                    </div>

    render: function() {
        const container = document.getElementById('reagents-content');

        let html = '<div class="prof-grid-wrapper">';

        for (const [profName, items] of Object.entries(REAGENTS_DB)) {

                const dbData = PRICES[item.name] || { price: 0, icon: DEF_ICON };

                if (count >= 20) cardClass = 'card-huge';
                else if (count >= 10) cardClass = 'card-large';

                const svgChart = this.getSmoothSparklineSVG(historyData);

    getQualityIcon: function(tier) {
        if(!tier) return '';
        return `<img src="tier${tier}.png" class="q-icon">`;
    },

    get24hChange: function(history, currentPrice) {
        if (!history || history.length < 2) return '';
        const now = Date.now();
        const oneDayAgo = now - (24 * 60 * 60 * 1000);
        let oldPrice = null;
        for (let i = history.length - 1; i >= 0; i--) { if (history[i].t <= oneDayAgo) { oldPrice = history[i].p; break; } }
        if (oldPrice === null) oldPrice = history[0].p;
        const diffPercent = ((currentPrice - oldPrice) / oldPrice) * 100;
        const absPercent = Math.abs(diffPercent).toFixed(0); 
        if (diffPercent > 0.5) return `<span class="trend-val trend-up">▲${absPercent}%</span>`;
        else if (diffPercent < -0.5) return `<span class="trend-val trend-down">▼${absPercent}%</span>`;
        else return `<span class="trend-val trend-neutral">~0%</span>`;
    },

    renderInteractiveChart: function(data) {
        const container = document.getElementById('interactive-chart');
        if (container.clientWidth === 0 || container.clientHeight === 0) return;

        if (!data || data.length < 2) { container.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#666;">Not enough history data</div>'; return; }

        let minP = Infinity, maxP = -Infinity;
        data.forEach(d => { if(d.p < minP) minP = d.p; if(d.p > maxP) maxP = d.p; });
        let padP = (maxP - minP) * 0.1; if(padP===0) padP = maxP*0.1 || 1;
        minP -= padP; maxP += padP;

        let minQ = Infinity, maxQ = -Infinity;
        data.forEach(d => { let q = d.q || 0; if(q < minQ) minQ = q; if(q > maxQ) maxQ = q; });
        let padQ = (maxQ - minQ) * 0.1; if(padQ===0) padQ = (maxQ*0.1) || 10;
        minQ -= padQ; maxQ += padQ; if (minQ < 0) minQ = 0;

        const width = container.clientWidth;
        const height = container.clientHeight;
        const len = data.length - 1;

        const getX = (i) => (i / len) * width;
        const getY_Price = (p) => height - ((p - minP) / (maxP - minP)) * height;
        const getY_Qty = (q) => height - (((q || 0) - minQ) / (maxQ - minQ)) * height;

        // --- SMOOTH (BEZIER) CHART ---
        let pathP = `M 0 ${getY_Price(data[0].p)}`;
        for (let i = 1; i < data.length; i++) {
            const x = getX(i); const y = getY_Price(data[i].p);
            const x0 = getX(i-1); const y0 = getY_Price(data[i-1].p);
            const cp1x = x0 + (x - x0) / 2;
            pathP += ` C ${cp1x} ${y0}, ${cp1x} ${y}, ${x} ${y}`;
        }
        const fillP = pathP + ` L ${width} ${height} L 0 ${height} Z`;

        let pathQ = `M 0 ${getY_Qty(data[0].q)}`;
        for (let i = 1; i < data.length; i++) {
            const x = getX(i); const y = getY_Qty(data[i].q);
            const x0 = getX(i-1); const y0 = getY_Qty(data[i-1].q);
            const cp1x = x0 + (x - x0) / 2;
            pathQ += ` C ${cp1x} ${y0}, ${cp1x} ${y}, ${x} ${y}`;
        }
        const fillQ = pathQ + ` L ${width} ${height} L 0 ${height} Z`;

        container.innerHTML = `
            <div id="chart-tooltip" class="chart-tooltip"></div>
            <div id="chart-cursor" class="chart-cursor"></div>
            <svg width="100%" height="100%" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" style="overflow:visible;">
                <defs>
                    <linearGradient id="gradP" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#0070dd" stop-opacity="0.4"/><stop offset="100%" stop-color="#0070dd" stop-opacity="0"/></linearGradient>
                    <linearGradient id="gradQ" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ff8800" stop-opacity="0.2"/><stop offset="100%" stop-color="#ff8800" stop-opacity="0"/></linearGradient>
                </defs>
                <path d="${fillQ}" fill="url(#gradQ)" stroke="none" />
                <path d="${pathQ}" fill="none" stroke="#ff8800" stroke-width="2" vector-effect="non-scaling-stroke" stroke-dasharray="4" />
                <path d="${fillP}" fill="url(#gradP)" stroke="none" />
                <path d="${pathP}" fill="none" stroke="#0070dd" stroke-width="3" vector-effect="non-scaling-stroke" />
            </svg>
        `;

        container.onmousemove = (e) => {
            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const index = Math.min(Math.max(Math.round((x / width) * len), 0), len);
            const point = data[index];
            if (!point) return;

            const cursor = document.getElementById('chart-cursor');
            const tooltip = document.getElementById('chart-tooltip');
            const exactX = getX(index);

            cursor.style.display = 'block';
            cursor.style.left = exactX + 'px';
            tooltip.style.opacity = '1';
            
            const date = new Date(point.t);
            tooltip.innerHTML = `
                <div style="color:#888; font-size:11px; margin-bottom:4px;">${date.toLocaleDateString()} ${date.getHours()}:00</div>
                <div style="display:flex; justify-content:space-between; gap:15px; margin-bottom:2px;">
                    <span style="color:#0070dd; font-weight:bold;">Price:</span>
                    <span style="color:#fff;">${point.p.toLocaleString()} g</span>
                </div>
                <div style="display:flex; justify-content:space-between; gap:15px;">
                    <span style="color:#ff8800; font-weight:bold;">Supply:</span>
                    <span style="color:#fff;">${(point.q||0).toLocaleString()}</span>
                </div>
            `;
            if (x > width / 2) { tooltip.style.left = 'auto'; tooltip.style.right = (width - exactX + 15) + 'px'; } 
            else { tooltip.style.left = (exactX + 15) + 'px'; tooltip.style.right = 'auto'; }
        };

        container.onmouseleave = () => {
            document.getElementById('chart-cursor').style.display = 'none';
            document.getElementById('chart-tooltip').style.opacity = '0';
        };
    },

    getSmoothSparklineSVG: function(data) {
        if (!data || data.length < 2) return '';
        const w = 100, h = 50;
        let min = Infinity, max = -Infinity;
        data.forEach(d => { if(d.p < min) min = d.p; if(d.p > max) max = d.p; });
        if(min === max) { min -= 1; max += 1; }

        let path = `M 0 ${h - ((data[0].p - min) / (max - min)) * h}`;
        for (let i = 1; i < data.length; i++) {
            const x = (i / (data.length - 1)) * w;
            const y = h - ((data[i].p - min) / (max - min)) * h;
            const x0 = ((i - 1) / (data.length - 1)) * w;
            const y0 = h - ((data[i-1].p - min) / (max - min)) * h;
            const cp1x = x0 + (x - x0) / 2;
            path += ` C ${cp1x} ${y0}, ${cp1x} ${y}, ${x} ${y}`;
        }
        const fillPath = path + ` L ${w} ${h} L 0 ${h} Z`;

        return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:100%;">
            <path d="${fillPath}" fill="#0070dd" fill-opacity="0.3" stroke="none" />
            <path d="${path}" fill="none" stroke="#0070dd" stroke-width="1.5" stroke-opacity="0.6" />
        </svg>`;
    },

    formatPrice: function(n) {
        if (n === 0) return '0';
        let val;
        if (n < 100) { val = n.toFixed(2); } else { val = Math.floor(n).toLocaleString(); }
        const icon = (typeof GOLD_ICON !== 'undefined') ? GOLD_ICON : 'gold.jpg';
        return `${val} <img src="${icon}" style="width:12px; vertical-align:-2px; border-radius:50%;">`;
    }
};

    openModal: function(profName, gIdx, rIdx) {
        if (typeof OVERVIEW_DB === 'undefined' || !OVERVIEW_DB[profName] || !OVERVIEW_DB[profName][gIdx] || !OVERVIEW_DB[profName][gIdx].recipes[rIdx]) return;
        
        const method = OVERVIEW_DB[profName][gIdx].recipes[rIdx];
        const moreInfo = method.moreInfo;
        
        if (!moreInfo || moreInfo.length === 0) {
            alert("No detailed information available for this item.");
            return;
        }

        let skill = 0;
        let tools = [];
        let rawImages = [];
        let buffs = [];

        moreInfo.forEach(block => {
            if (block.header) {
                block.header.forEach(hItem => {
                    if (hItem.skill !== undefined) skill = hItem.skill;
                    if (hItem.tools) tools = hItem.tools;
                });
            }
            if (block.body) {
                block.body.forEach(bItem => {
                    if (bItem.talantes) {
                        let tals = Array.isArray(bItem.talantes) ? bItem.talantes : [bItem.talantes];
                        rawImages = tals.map(t => {
                            if (typeof t === 'string') return { screen: t, note: '' };
                            return { screen: t.screen || '', note: t.note || '' };
                        });
                    }
                });
            }
            if (block.footer) {
                block.footer.forEach(fItem => {
                    if (fItem.buffs) buffs = fItem.buffs;
                });
            } else if (block.buffs) { 
                buffs = block.buffs;
            }
        });

        document.getElementById('po-modal-title').innerText = profName;
        
        const maxSkill = 100;
        const skillVisual = Math.min(skill, maxSkill);
        document.getElementById('po-modal-skill-txt').innerText = `${skill} / ${maxSkill}`;
        
        const barColor = (typeof PROF_COLORS !== 'undefined' && PROF_COLORS[profName.toUpperCase()]) 
            ? PROF_COLORS[profName.toUpperCase()] 
            : '#ffd700'; 
        
        const fillEl = document.getElementById('po-modal-skill-fill');
        fillEl.style.background = barColor;
        
        setTimeout(() => {
            fillEl.style.width = `${skillVisual}%`;
        }, 50);

        const toolsHtml = tools.map(t => {
            const icon = t.iconAccessory1 || t.iconAccessory2 || t.iconAccessory3 || '';
            const info = t.iconAccessory1Info || t.iconAccessory2Info || t.iconAccessory3Info || '';
            if(!icon) return '';
            return `<div class="img-tooltip-wrap"><img src="${icon}" class="po-tool-icon"><img src="${info}" class="tooltip-img"></div>`;
        }).join('');
        document.getElementById('po-modal-tools').innerHTML = toolsHtml;

        this.currentGallery = rawImages.filter(g => g.screen);
        this.currentGalleryIndex = 0;
        
        let bodyHtml = '';
        if (this.currentGallery.length > 0) {
            let navHtml = '';
            if (this.currentGallery.length > 1) {
                navHtml = `
                    <div class="po-nav-btn po-nav-left" onclick="event.stopPropagation(); ProfOverview.changeGallery(-1)">&#8249;</div>
                    <div class="po-nav-btn po-nav-right" onclick="event.stopPropagation(); ProfOverview.changeGallery(1)">&#8250;</div>
                `;
            }
            
            const firstItem = this.currentGallery[0];
            const noteDisplay = firstItem.note ? 'block' : 'none';
            
            bodyHtml = `
                <div class="po-img-gallery">
                    ${navHtml}
                    <div id="po-modal-img-wrap" class="po-img-wrapper" onclick="this.classList.toggle('zoomed')">
                        <img id="po-modal-main-img" src="${firstItem.screen}" class="po-gallery-img">
                        <div id="po-modal-note" class="po-gallery-note" style="display: ${noteDisplay};">${firstItem.note}</div>
                    </div>
                </div>
            `;
        } else {
            bodyHtml = '<div style="color:#777; font-style:italic;">No image provided</div>';
        }
        document.getElementById('po-modal-body').innerHTML = bodyHtml;

        const footerIconsHtml = buffs.map(b => {
            const icon = b.buff1Icon || b.buff2Icon || '';
            const info = b.buff1Info || b.buff2Info || '';
            if(!icon) return '';
            return `<div class="img-tooltip-wrap"><img src="${icon}" class="po-tool-icon"><img src="${info}" class="tooltip-img"></div>`;
        }).join('');
        document.getElementById('po-modal-footer-icons').innerHTML = footerIconsHtml;

        const importBtn = document.getElementById('po-modal-import-btn');
        importBtn.innerText = "IMPORT"; 
        importBtn.style.backgroundColor = "";
        importBtn.style.color = "";
        importBtn.onclick = () => ProfOverview.copyRecipeJSON(method, importBtn);

        document.getElementById('po-custom-modal').style.display = 'flex';
    },

    copyRecipeJSON: function(method, btn) {
        const recipeData = JSON.parse(JSON.stringify(method));
        delete recipeData.moreInfo;

        if (recipeData.reagents) {
            let cheapestIdx = -1;
            let minCost = Infinity;

            recipeData.reagents.forEach((reg, idx) => {
                if (reg.pickCheapestReagent) {
                    const pItem = typeof PRICES !== 'undefined' ? PRICES[reg.name] || {} : {};
                    const price = pItem.price || 0;
                    const total = price * reg.count;
                    
                    if (total < minCost) {
                        minCost = total;
                        cheapestIdx = idx;
                    }
                }
            });

            if (cheapestIdx !== -1) {
                const cheapestReg = recipeData.reagents[cheapestIdx];
                
                // Якщо НЕмає прапорця keepMainIcon, тоді підміняємо ID і назву
                if (!recipeData.keepMainIcon) {
                    recipeData.item = cheapestReg.name;
                    if (cheapestReg.id) {
                        recipeData.id = cheapestReg.id;
                    }
                }

                recipeData.reagents = recipeData.reagents.filter((reg, idx) => {
                    return !reg.pickCheapestReagent || idx === cheapestIdx;
                });
            }

            recipeData.reagents.forEach(reg => {
                delete reg.pickCheapestReagent;
            });
        }
        
        // Видаляємо допоміжний прапорець перед імпортом
        delete recipeData.keepMainIcon;

        const jsonOutput = JSON.stringify(recipeData, null, 4);

        const tempText = document.createElement("textarea");
        tempText.value = jsonOutput;
        document.body.appendChild(tempText);
        tempText.select();
        document.execCommand("copy");
        document.body.removeChild(tempText);

        const originalText = "IMPORT";
        
        btn.innerText = "COPIED";
        btn.style.backgroundColor = "var(--green)";
        btn.style.color = "#000";
        
        setTimeout(() => {
            btn.innerText = originalText;
            btn.style.backgroundColor = ""; 
            btn.style.color = "";
        }, 2000);
    },

    changeGallery: function(direction) {
        if (!this.currentGallery || this.currentGallery.length <= 1) return;
        
        this.currentGalleryIndex += direction;
        if (this.currentGalleryIndex < 0) this.currentGalleryIndex = this.currentGallery.length - 1;
        if (this.currentGalleryIndex >= this.currentGallery.length) this.currentGalleryIndex = 0;
        
        const currentItem = this.currentGallery[this.currentGalleryIndex];
        const wrapEl = document.getElementById('po-modal-img-wrap');
        const imgEl = document.getElementById('po-modal-main-img');
        const noteEl = document.getElementById('po-modal-note');
        
        wrapEl.style.opacity = 0;
        
        setTimeout(() => {
            imgEl.src = currentItem.screen;
            
            if (currentItem.note) {
                noteEl.innerHTML = currentItem.note;
                noteEl.style.display = 'block';
            } else {
                noteEl.style.display = 'none';
            }
            
            wrapEl.style.opacity = 1;
        }, 200);
    },

    closeModal: function() {
        document.getElementById('po-custom-modal').style.display = 'none';
        document.getElementById('po-modal-skill-fill').style.width = '0%';
        
        const wrap = document.getElementById('po-modal-img-wrap');
        if (wrap) wrap.classList.remove('zoomed');
    },

    switchTab: function(mode) {
        this.activeTab = mode;
        this.render(); 
    },

    render: function() {
        const container = document.getElementById('profOverview-content');
        if (!container) return;

        let theadHtml = '';
        let tbodyHtml = '';
        
        if (this.activeTab === 'farming') {
            theadHtml = `
                <th style="padding-top: 12px; padding-bottom: 12px;">
                    <div class="header-controls">
                        <input type="text" class="search-input" placeholder="Search..." onkeyup="ProfOverview.filterRows(this.value)">
                        <select class="mode-select" onchange="ProfOverview.switchTab(this.value)">
                            <option value="farming" selected>Farming</option>
                            <option value="concentration">Concentration</option>
                        </select>
                    </div>
                </th>
                <th style="text-align: center; width: 1%;">Profession</th>
                <th style="text-align:right;">Exp. Profit (Best)</th>
            `;
            tbodyHtml = this.generateFarmingRows();
            if (!tbodyHtml.startsWith('<tbody')) tbodyHtml = `<tbody>${tbodyHtml}</tbody>`;

        } else {
            theadHtml = `
                <th style="padding-top: 12px; padding-bottom: 12px;">
                    <div class="header-controls">
                        <input type="text" class="search-input" placeholder="Search item..." onkeyup="ProfOverviewConcentration.filterRows(this.value)">
                        <select class="mode-select" onchange="ProfOverview.switchTab(this.value)">
                            <option value="farming">Farming</option>
                            <option value="concentration" selected>Concentration</option>
                        </select>
                    </div>
                </th>
                <th style="text-align:right;">AH Price</th>
                <th style="text-align:right; color: var(--green); cursor: pointer; user-select: none;" onclick="ProfOverviewConcentration.applySort('profit')" title="Sort by Profit">Profit ▼</th>
                <th style="text-align:right; color: #00ccff; cursor: pointer; user-select: none;" onclick="ProfOverviewConcentration.applySort('pc')" title="Sort by Profit/Concentration">P/C ▼</th>
            `;
            tbodyHtml = `<tbody id="conc-body-target"><tr><td colspan="4" style="text-align:center; padding:40px; color:#ffd700;">Loading Concentration Data...</td></tr></tbody>`;
        }

        container.innerHTML = `
            <div class="overview-container">
                <table class="ov-table">
                    <thead><tr>${theadHtml}</tr></thead>
                    ${tbodyHtml}
                </table>
            </div>
        `;

        if (this.activeTab === 'concentration') {
            setTimeout(() => {
                if (typeof ProfOverviewConcentration !== 'undefined' && ProfOverviewConcentration.init) {
                    ProfOverviewConcentration.init();
                }
            }, 50);
        }
    },

    filterRows: function(query) {
        const term = query.toLowerCase();

        if (this.activeTab === 'farming') {
            const rows = document.querySelectorAll('.ov-row');
            rows.forEach(row => {
                const groupTitle = row.querySelector('.group-title') ? row.querySelector('.group-title').innerText.toLowerCase() : '';
                const profBadge = row.querySelector('.prof-badge') ? row.querySelector('.prof-badge').innerText.toLowerCase() : '';
                const detailsRow = row.nextElementSibling;
                
                if (groupTitle.includes(term) || profBadge.includes(term)) {
                    row.style.display = '';
                    if(detailsRow && row.classList.contains('show')) detailsRow.style.display = ''; 
                } else {
                    row.style.display = 'none';
                    if(detailsRow) detailsRow.style.display = 'none';
                }
            });
        } else {
            const rows = document.querySelectorAll('.conc-row');
            rows.forEach(row => {
                const text = row.innerText.toLowerCase();
                row.style.display = text.includes(term) ? '' : 'none';
            });
        }
    },

    fmt: function(n) {
        if (isNaN(n) || !n || n === 0) return '0 <img src="gold.jpg" style="width:12px; vertical-align:-2px; border-radius:50%;">';
        let val = (n < 100) ? n.toFixed(1) : Math.floor(n).toLocaleString();
        const icon = (typeof GOLD_ICON !== 'undefined') ? GOLD_ICON : 'gold.jpg';
        return `${val} <img src="${icon}" style="width:12px; vertical-align:-2px; border-radius:50%;">`;
    },

    getQualityIcon: function(tier) {
        if(!tier) return '';
        return `<img src="tier${tier}.png" class="q-icon">`;
    },

    toggle: function(id) {
        const wrapper = document.getElementById(id);
        const cell = wrapper.parentElement;
        const row = cell.parentElement;
        const mainRow = row.previousElementSibling;

        if (row.classList.contains('show')) {
            wrapper.style.overflow = 'hidden'; 
            wrapper.classList.remove('open');
            mainRow.classList.remove('expanded');
            setTimeout(() => {
                if(!wrapper.classList.contains('open')) row.classList.remove('show');
            }, 400); 
        } else {
            row.classList.add('show');
            mainRow.classList.add('expanded');
            setTimeout(() => {
                wrapper.classList.add('open');
                setTimeout(() => {
                    if (wrapper.classList.contains('open')) {
                        wrapper.style.overflow = 'visible'; 
                    }
                }, 400);
            }, 10);
        }
    },

    generateFarmingRows: function() {
        if (typeof OVERVIEW_DB === 'undefined') return '<tr><td colspan="3" style="padding:20px; text-align:center;">No farming data loaded.</td></tr>';

        let groupDataArray = [];

        for (const [profName, groups] of Object.entries(OVERVIEW_DB)) {
            const badgeColor = (typeof PROF_COLORS !== 'undefined' && PROF_COLORS[profName]) ? PROF_COLORS[profName] : '#333';

            groups.forEach((group, gIdx) => {
                const groupTitle = group.groupName || "Unnamed Group";
                const groupDisTime = group.disTime || 0; 

                let groupIconHtml = group.icon ? `<img src="${group.icon}" class="group-icon">` : '';

                let cardsHtml = '';
                let maxProfitPerCraft = -Infinity; 
                let maxGPH = 0; 

                if (group.recipes) {
                    group.recipes.forEach((method, rIdx) => {
                        const dbItem = PRICES[method.item] || { price: 0, icon: DEF_ICON };
                        const cardColor = method.color || '#ffd700';
                        const baseCraftTime = method.craftTime || 0; 
                        const timePenalty = (method.timePenalty !== undefined) ? method.timePenalty : 0;
                        const isGathering = method.isGathering || false;

                        let cardTitle = method.item;
                        let mainIcon = method.customIcon || dbItem.icon || DEF_ICON;

                        let baseCraftCost = 0;
                        let reagentsHtml = '';
                        let activeReagentsForStats = [];

                        if (method.reagents && method.reagents.length > 0) {
                            reagentsHtml += `<div class="section-label">INPUTS</div>`;
                            reagentsHtml += `<div class="reagents-scroll-wrapper">`;

                            let cheapestIdx = -1;
                            let minCost = Infinity;

                            method.reagents.forEach((reg, idx) => {
                                if (reg.pickCheapestReagent) {
                                    const pItem = PRICES[reg.name] || {};
                                    const price = pItem.price || 0;
                                    const total = price * reg.count;
                                    
                                    if (total < minCost) {
                                        minCost = total;
                                        cheapestIdx = idx;
                                    }
                                }
                            });

                            // [ОНОВЛЕНО] Перевірка прапорця method.keepMainIcon
                            if (cheapestIdx !== -1 && !method.customIcon && !method.keepMainIcon) {
                                const cName = method.reagents[cheapestIdx].name;
                                cardTitle = cName;
                                mainIcon = (PRICES[cName] || {}).icon || DEF_ICON;
                            } 

                            method.reagents.forEach((reg, idx) => {
                                const regData = PRICES[reg.name] || {};
                                const regPrice = regData.price || 0; 
                                const regIcon = regData.icon || DEF_ICON; 
                                const totalRegCost = regPrice * reg.count;
                                
                                let displayName = reg.name;
                                let tierHtml = '';
                                const match = displayName.match(/ [tq]([1-3])/i);
                                if (match) {
                                    tierHtml = this.getQualityIcon(match[1]);
                                    displayName = displayName.replace(match[0], '').trim();
                                }

                                let isActive = true;
                                let highlightClass = "";

                                if (reg.pickCheapestReagent) {
                                    if (idx === cheapestIdx) {
                                        highlightClass = "cheapest-highlight"; 
                                    } else {
                                        isActive = false; 
                                        highlightClass = "dimmed-reagent";
                                    }
                                }

                                reagentsHtml += `
                                    <div class="mini-reg ${highlightClass}">
                                        <img src="${regIcon}" class="mini-reg-icon">
                                        <div class="mini-reg-info">
                                            <div class="mini-reg-name">${displayName}${tierHtml}</div>
                                            <div class="mini-reg-sub">${reg.count}x</div>
                                        </div>
                                        <div class="mini-reg-price">-${this.fmt(totalRegCost)}</div>
                                    </div>`;

                                if (isActive) {
                                    baseCraftCost += totalRegCost;
                                    activeReagentsForStats.push({ ...reg, total: totalRegCost }); 
                                }
                            });
                            
                            reagentsHtml += `</div>`;
                        }

                        let cardTierHtml = '';
                        const titleMatch = cardTitle.match(/ [tq]([1-3])/i);
                        if (titleMatch) {
                            cardTierHtml = this.getQualityIcon(titleMatch[1]);
                            cardTitle = cardTitle.replace(titleMatch[0], '').trim();
                        }

                        let totalRevenue = 0;
                        let outputsHtml = '';
                        if (method.outputs && method.outputs.length > 0) {
                            outputsHtml += `<div class="section-label" style="margin-top:12px;">YIELDS</div>`;
                            method.outputs.forEach(out => {
                                const outData = PRICES[out.name] || { price: 0, icon: DEF_ICON };
                                const outValue = outData.price * out.count; 
                                totalRevenue += outValue;
                                
                                let displayName = out.name;
                                let tierHtml = '';
                                const match = displayName.match(/ [tq]([1-3])/i);
                                if (match) {
                                    tierHtml = this.getQualityIcon(match[1]);
                                    displayName = displayName.replace(match[0], '').trim();
                                }
                                outputsHtml += `<div class="mini-out"><img src="${outData.icon}" class="mini-out-icon"><div class="mini-out-info"><div class="mini-out-name">${displayName}${tierHtml}</div><div class="mini-out-sub">${out.count}x avg</div></div><div class="mini-out-val">+${this.fmt(outValue)}</div></div>`;
                            });
                        } else {
                            totalRevenue = dbItem.price;
                        }

                        let resSavings = 0;
                        let statsHtml = '';
                        let bonusRows = '';
                        let craftSpeedPct = 0;
                        
                        if (method.stats && method.stats.length > 0) {
                            let statsRows = `<div class="stats-header">Stats</div>`;
                            const MULTI_BONUS_VAL = typeof MULTI_BONUS !== 'undefined' ? MULTI_BONUS : 2.5; 

                            method.stats.forEach(stat => {
                                statsRows += `<div class="stat-row"><span>${stat.name}</span><span class="stat-val">${stat.count}%</span></div>`;
                                
                                const sName = stat.name.toLowerCase();
                                const penalty = stat.statPenalty !== undefined ? stat.statPenalty : null;

                                if (sName.includes('speed')) craftSpeedPct = stat.count;

                                if (sName.includes('resourcefulness')) {
                                    let currentResSaving = 0;
                                    let resCapeFactor = stat.resourcefulnessCape !== undefined ? (stat.resourcefulnessCape / 100) : null;
                                    const finalPenalty = stat.statPenalty !== undefined ? stat.statPenalty : 1.0;

                                    activeReagentsForStats.forEach(reg => {
                                        const returnFactor = resCapeFactor !== null ? resCapeFactor : ((reg.count === 1) ? 1.0 : 0.5);
                                        currentResSaving += reg.total * (stat.count / 100) * returnFactor;
                                    });
                                    
                                    resSavings = currentResSaving * finalPenalty;
                                    if (resSavings > 0) bonusRows += `<div class="stat-row"><span>Res. Save</span><span class="stat-bonus">+${this.fmt(resSavings)}</span></div>`;
                                }
                                
                                if (sName.includes('multicraft')) {
                                    const finalPenalty = stat.statPenalty !== undefined ? stat.statPenalty : 0.8;
                                    const mBonus = stat.multiBonus !== undefined ? stat.multiBonus : MULTI_BONUS_VAL;
                                    const extra = ((stat.count / 100) * mBonus * totalRevenue) * finalPenalty; 
                                    if (extra > 0) bonusRows += `<div class="stat-row"><span>Multicraft (${finalPenalty * 100}%)</span><span class="stat-bonus">+${this.fmt(extra)}</span></div>`;
                                }

                                if (sName.includes('ingenuity')) {
                                    const finalPenalty = stat.statPenalty !== undefined ? stat.statPenalty : 0.8;
                                    const extra = ((stat.count / 100) * (profName.toUpperCase().includes("ENCHANTING") ? 1.0 : 0.5) * totalRevenue) * finalPenalty;
                                    if (extra > 0) bonusRows += `<div class="stat-row"><span>Ingenuity (${finalPenalty * 100}%)</span><span class="stat-bonus">+${this.fmt(extra)}</span></div>`;
                                }
                            });
                            
                            if(bonusRows) bonusRows = `<div class="avg-profit-header">Avg Savings / Bonus</div>` + bonusRows;
                            
                            let efficiencyRows = '';
                            let currentGPH = 0;

                            if (isGathering) {
                                const effectiveCost = baseCraftCost - resSavings;
                                const currentProfit = totalRevenue - effectiveCost;
                                currentGPH = currentProfit;

                                efficiencyRows = `
                                    <div class="avg-profit-header" style="color:#00ccff; border-top:1px dashed #444; margin-top:8px;">Yield</div>
                                    <div class="stat-row"><span>Yield Period</span><span class="stat-val">1 Hour</span></div>
                                    <div class="stat-row"><span>Est. GPH</span><span class="stat-bonus" style="color:#ffd700; font-size:13px;">${this.fmt(currentGPH)}</span></div>
                                `;
                            } else {
                                if ((baseCraftTime > 0 || groupDisTime > 0)) {
                                    let realCraftTime = baseCraftTime;
                                    if(craftSpeedPct > 0) {
                                        realCraftTime = baseCraftTime * (1 - (craftSpeedPct / 100));
                                        if(realCraftTime < 0) realCraftTime = 0;
                                    }
                                    const rawCycleTime = realCraftTime + groupDisTime;
                                    const totalCycleTime = rawCycleTime * (1 + (timePenalty / 100)); 
                                    
                                    if (totalCycleTime > 0) {
                                        const itemsPerHour = 3600 / totalCycleTime;
                                        const effectiveCost = baseCraftCost - resSavings;
                                        const currentProfit = totalRevenue - effectiveCost;
                                        currentGPH = currentProfit * itemsPerHour;

                                        efficiencyRows = `
                                            <div class="avg-profit-header" style="color:#00ccff; border-top:1px dashed #444; margin-top:8px;">Efficiency</div>
                                            <div class="stat-row"><span>Cycle Time (+${timePenalty}%)</span><span class="stat-val">${totalCycleTime.toFixed(1)}s</span></div>
                                            <div class="stat-row"><span>Cycles/Hr</span><span class="stat-val">${Math.floor(itemsPerHour).toLocaleString()}</span></div>
                                            <div class="stat-row"><span>Exp. GPH</span><span class="stat-bonus" style="color:#ffd700; font-size:13px;">${this.fmt(currentGPH)}/hr</span></div>
                                        `;
                                    }
                                }
                            }
                            if (currentGPH > maxGPH) maxGPH = currentGPH;
                            statsHtml = `<div class="cu-divider"></div><div class="stats-section">${statsRows}${bonusRows}${efficiencyRows}</div>`;
                        }

                        const effectiveCost = baseCraftCost - resSavings;
                        const profit = totalRevenue - effectiveCost;
                        
                        const displayProfitValue = isGathering ? maxGPH : profit;

                        if (displayProfitValue > maxProfitPerCraft) maxProfitPerCraft = displayProfitValue;
                        const profitClass = displayProfitValue >= 0 ? 'p-pos' : 'p-neg';

                        const modalBtnHtml = (method.moreInfo && method.moreInfo.length > 0) 
                            ? `<div class="po-info-btn" onclick="event.stopPropagation(); ProfOverview.openModal('${profName.replace(/'/g, "\\'")}', ${gIdx}, ${rIdx})" title="More Info">i</div>` 
                            : '';

                        let hoverTitle = method.item;
                        cardsHtml += `
                            <div class="craft-unit" style="border-color: ${cardColor};">
                                ${modalBtnHtml}
                                <div class="cu-left">
                                    <div class="cu-left-top">
                                        <img src="${mainIcon}" class="cu-icon" style="border-color: ${cardColor};">
                                        <div class="cu-title" title="${hoverTitle}">${cardTitle}${cardTierHtml}</div>
                                        <div class="cu-stat"><span class="cu-label">Cost</span><span class="cu-val val-cost">${this.fmt(effectiveCost)}</span></div>
                                        <div class="cu-stat"><span class="cu-label">Revenue</span><span class="cu-val val-rev">${this.fmt(totalRevenue)}</span></div>
                                        <div class="cu-stat" style="margin-top:8px; border-top:1px solid #444; padding-top:5px;">
                                            <span class="cu-label">Net Profit</span><span class="cu-val ${profitClass}" style="font-size:16px;">${this.fmt(displayProfitValue)}</span>
                                        </div>
                                    </div>
                                    ${statsHtml}
                                </div>
                                <div class="cu-right">${reagentsHtml}${outputsHtml}</div>
                            </div>
                        `;
                    });
                }

                let sortValue = -99999999;
                if (maxGPH > 0) sortValue = maxGPH;
                else if (maxProfitPerCraft > -Infinity) sortValue = maxProfitPerCraft;

                let displayVal = 'N/A';
                if (maxGPH > 0) displayVal = `Up to <span style="color:#ffd700;">${this.fmt(maxGPH)}</span> / hr`;
                else if (maxProfitPerCraft > -Infinity) {
                    const color = maxProfitPerCraft >= 0 ? 'var(--green)' : '#f44';
                    displayVal = `Up to <span style="color:${color};">${this.fmt(maxProfitPerCraft)}</span> (craft)`;
                }
                
                const rowId = `group-${profName}-${gIdx}`.replace(/\s/g, '');

                const groupHtml = `
                    <tr class="ov-row" onclick="ProfOverview.toggle('${rowId}')">
                        <td>
                            <div class="group-cell-content">
                                ${groupIconHtml}
                                <div class="group-info">
                                    <div class="group-title">${groupTitle}</div>
                                    <div class="group-sub">${group.recipes ? group.recipes.length : 0} items monitored</div>
                                </div>
                            </div>
                        </td>
                        <td class="prof-badge-cell">
                            <span class="prof-badge" style="background: ${badgeColor};">${profName}</span>
                        </td>
                        <td><div class="profit-val">${displayVal}</div></td>
                    </tr>
                    <tr class="ov-details-row">
                        <td colspan="3" class="ov-details-cell">
                            <div id="${rowId}" class="ov-expand-wrapper">
                                <div class="cards-container">${cardsHtml}</div>
                            </div>
                        </td>
                    </tr>
                `;

                groupDataArray.push({ html: groupHtml, sortVal: sortValue });
            });
        }

        groupDataArray.sort((a, b) => b.sortVal - a.sortVal);

        return groupDataArray.map(item => item.html).join('');
